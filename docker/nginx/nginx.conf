server {
    listen 80;
    server_name _;

    # Agent clients (ZCode etc.) send large chat/tool histories.
    # Default nginx limit is 1m and returns 413 Payload Too Large.
    client_max_body_size 128m;

    # Public landing page (synthlabs-style free token UI)
    # Served from host-mounted ./public
    root /usr/share/nginx/html;
    index index.html;

    # Health check — bypass intel (no need to log health probes)
    location = /healthz {
        proxy_pass http://grok2api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Public free-token status API (host process on :8002)
    location = /api/public/status {
        proxy_pass http://host.docker.internal:8002/api/public/status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin *;
    }

    # API endpoints — route through intel so traffic is captured
    # nginx → traffic_intel (host:8001) → grok2api (host:8000)
    location /v1/ {
        proxy_pass http://host.docker.internal:8001;
        proxy_set_header Host $host;
        # Cloudflare sets the real client IP here
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # SSE streaming support
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 2h;
        chunked_transfer_encoding on;
    }

    # Landing page + static assets only (admin/docs stay blocked)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
